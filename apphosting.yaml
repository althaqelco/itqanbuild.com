# Firebase App Hosting — Cloud Run + Cloud CDN
# ملاحظة: الـ region يُحدَّد عند إنشاء الـ backend (فعلياً asia-southeast1)، لا من هنا.
#
# 🧪 minInstances: 0 + إحماء دوري — تجربة بدأت 2026-11-16.
#    الخلفية: الخادم البارد يُسقط زواحف الذكاء الاصطناعي — اختبار
#    scripts/ai-crawler-sim.mjs (يوليو 2026) أثبت انقطاع GPTBot و OAI-SearchBot
#    (TIMEOUT > 20s) عند أول اتصال بخادم بارد؛ TTFB بارداً 6–20s+ مقابل 0.3–1.5s
#    ساخناً. وكلاء الجلب الحيّ (ChatGPT-User / Perplexity-User / Claude-User) هم
#    *لحظة الاستشهاد* ومهلتهم قصيرة، فالانقطاع = لا استشهاد.
#    الحل السابق (minInstances: 1) كلّف ~$9.30/شهر — 99% من فاتورة المشروع —
#    مقابل 58 دقيقة معالجة فعلية في الشهر.
#    الحل الحالي: مهمة Cloud Scheduler «warm-itqanbuild» تطلب /api/warm كل 5 دقائق.
#    Cloud Run يُبقي الخادم الخامل حتى 15 دقيقة بلا محاسبة (request-based billing)،
#    فالطلب الدوري يبقيه ساخناً بسنتات. ليس ضماناً من جوجل: قد يُعاد تدوير الخادم،
#    وعندها يتحمّل طلب الإحماء التالي البرودة (نافذة ≤ 5 دقائق).
#    ↩️ للرجوع: minInstances: 1 هنا + إيقاف مهمة الـScheduler. ارجع إن أظهر
#    ai-crawler-sim أي TIMEOUT على الموقع الحي، أو إن توقفت المهمة.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://itqanbuild.com
  - variable: NEXT_PUBLIC_GA4_ID
    value: G-G55B7C5N9L
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
