# Firebase App Hosting — Cloud Run + Cloud CDN
# ملاحظة: الـ region يُحدَّد عند إنشاء الـ backend (فعلياً asia-southeast1)، لا من هنا.
#
# 🤖 minInstances: 1 — أُعيد من 0 بعد اختبار زحف حقيقي (scripts/ai-crawler-sim.mjs)
#    أثبت فقداناً فعلياً: GPTBot و OAI-SearchBot انقطعا (TIMEOUT > 20s) عند أول
#    اتصال بخادم بارد، بينما نجح الاثنان فوراً بعد الإحماء. TTFB بارداً 6–20s+
#    مقابل 0.3–1.5s ساخناً.
#    السبب أن هذا يهمّ: وكلاء الجلب الحيّ (ChatGPT-User / Perplexity-User /
#    Claude-User) هم *لحظة الاستشهاد* في محرّكات بحث الذكاء الاصطناعي، ولديهم
#    مهلة قصيرة، ويصلون متفرّقين بعد خمول — أي بالضبط حين يكون الخادم بارداً.
#    الانقطاع = لا استشهاد. التكلفة ~$8–9/شهر مقابل ضمان الظهور في AI Overviews
#    وChatGPT وPerplexity — مقايضة مقصودة لصالح الـAEO.
runConfig:
  minInstances: 1
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://itqanbuild.com
  - variable: NEXT_PUBLIC_GA4_ID
    value: G-G55B7C5N9L
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
